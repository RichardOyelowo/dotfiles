# ------------------------------
# General
# ------------------------------
set -g mouse on
set -g focus-events on
set -sg escape-time 10
set -g renumber-windows on
set -g history-limit 100000

# True color
set-option -sa terminal-overrides ",xterm-256color:RGB"
set -g default-terminal "tmux-256color"

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Vi mode
setw -g mode-keys vi

# ------------------------------
# Splits
# ------------------------------
bind \\ split-window -h
bind - split-window -v

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/dotfiles/tmux/tmux.conf \; display "tmux reloaded"

# ------------------------------
# Status bar
# ------------------------------
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left side
set -g status-left "#[fg=#89b4fa,bg=#1e1e2e,bold] #S "

# Right side
set -g status-right "#[fg=#a6e3a1] %Y-%m-%d #[fg=#89b4fa] %H:%M "

# Window tabs
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "

# Pane border
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Message styling
set -g message-style "bg=#1e1e2e,fg=#89b4fa"

# ------------------------------
# TPM Plugins
# ------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
