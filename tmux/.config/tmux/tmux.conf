# ------------------------------
# General
# ------------------------------
set -g mouse on
set -g focus-events on
set -sg escape-time 10
set -g renumber-windows on
set -g history-limit 100000
set -g detach-on-destroy off
set -g set-clipboard on
set -g display-time 2500
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 120
set -g popup-border-lines rounded

# True color
set-option -sa terminal-overrides ",xterm-256color:RGB"
set -g default-terminal "tmux-256color"

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Vi mode
setw -g mode-keys vi

# ------------------------------
# Splits
# ------------------------------
bind \\ split-window -h
bind - split-window -v

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

# Project flow
bind o display-popup -E -w 85% -h 75% "$HOME/.local/bin/tmux-sessionizer"
bind O run-shell "$HOME/.local/bin/tmux-sessionizer"
bind g display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "lazygit"
bind / display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "fzf --height 100% --border rounded"
bind X confirm-before -p "kill session #S? (y/n)" "kill-session"

# ------------------------------
# Status bar
# ------------------------------
set -g status-position top
set -g status-justify left
set -g status-style "bg=#070a16,fg=#cdd6f4"

# Left side
set -g status-left "#[fg=#89dceb,bg=#070a16]#[fg=#070a16,bg=#89dceb,bold]  #[fg=#cdd6f4,bg=#0d1224] Richard #[fg=#0d1224,bg=#070a16]  #[fg=#f5c2e7,bg=#070a16]#[fg=#070a16,bg=#f5c2e7,bold] 󱂬 #[fg=#8b91a8,bg=#0d1224] workspace #[fg=#cdd6f4,bg=#0d1224,bold]#{?#{==:#S,0},main,#S} #[fg=#0d1224,bg=#070a16]  "

# Right side
set -g status-right "#[fg=#89b4fa,bg=#070a16]#[fg=#070a16,bg=#89b4fa,bold]  #[fg=#89b4fa,bg=#0d1224] dir #[fg=#cdd6f4,bg=#0d1224,bold]#{b:pane_current_path} #[fg=#0d1224,bg=#070a16]  #[fg=#a6e3a1,bg=#070a16]#[fg=#070a16,bg=#a6e3a1,bold]  #[fg=#cdd6f4,bg=#0d1224] %H:%M #[fg=#0d1224,bg=#070a16] "

# Window tabs
setw -g window-status-separator ""
setw -g window-status-style "fg=#6c7086,bg=#070a16"
setw -g window-status-format "#[fg=#7dd3fc,bg=#070a16]#[fg=#070a16,bg=#7dd3fc,bold] #I #[fg=#cdd6f4,bg=#0d1224] #W#{?window_zoomed_flag, 󰊓,} #[fg=#0d1224,bg=#070a16]  "
setw -g window-status-current-format "#[fg=#22d3ee,bg=#070a16]#[fg=#070a16,bg=#22d3ee,bold] #I #[fg=#cdd6f4,bg=#0d1224,bold] #W#{?window_zoomed_flag, 󰊓,} #[fg=#0d1224,bg=#070a16]  "

# Pane border
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message styling
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#89b4fa,fg=#11111b"

# ------------------------------
# TPM Plugins
# ------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
