gui:
  theme:
    activeBorderColor:
      - blue
      - bold
    inactiveBorderColor:
      - '#6c7086'
    optionsTextColor:
      - cyan
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    unstagedChangesColor:
      - red

git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never
