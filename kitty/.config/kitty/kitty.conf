color4  #57c7ff
color5  #ff6ac1
color6  #9aedfe
color7  #f1f1f0
color8  #1a1a2e
color9  #ff5c57
color10 #5af78e
color11 #f3f99d
color12 #57c7ff
color13 #ff6ac1
